name: Deploy redirects to GitHub Pages

# Since the cutover (2026-10-15) the site lives at https://rack-density.com (Cloudflare Pages, deploy-cloudflare.yml).
# This workflow keeps https://lida0407.github.io/rack-density-site/ alive as redirects only: every route → the same path on rack-density.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build                                   # to know every route
      - run: node scripts/make-redirects.mjs dist redirect
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
